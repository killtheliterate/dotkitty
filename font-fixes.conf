# vim:ft=kitty

# Symbols Nerd Font v3 symbol_map
# Debug missing/incorrect glyphs with: kitty --debug-font-fallback

# Pomicons
symbol_map U+E000-U+E00D Symbols Nerd Font

# Powerline
symbol_map U+E0A0-U+E0A2,U+E0B0-U+E0B3 Symbols Nerd Font

# Powerline Extra (v3: added U+E0CA, extended end to U+E0D7)
symbol_map U+E0A3,U+E0B4-U+E0C8,U+E0CA,U+E0CC-U+E0D7 Symbols Nerd Font

# Seti-UI + Custom (v3: extended from U+E62B to U+E6B5)
symbol_map U+E5FA-U+E6B5 Symbols Nerd Font

# Devicons
symbol_map U+E700-U+E7C5 Symbols Nerd Font

# Font Awesome
symbol_map U+F000-U+F2E0 Symbols Nerd Font

# Font Awesome Extension
symbol_map U+E200-U+E2A9 Symbols Nerd Font

# Octicons (v3: extended from U+F4A8 to U+F533)
symbol_map U+F400-U+F533,U+2665,U+26A1,U+F27C Symbols Nerd Font

# Font Logos / Font Linux (v3: extended from U+F313 to U+F372)
symbol_map U+F300-U+F372 Symbols Nerd Font

# IEC Power Symbols
symbol_map U+23FB-U+23FE,U+2B58 Symbols Nerd Font

# Material Design Icons
symbol_map U+F500-U+FD46 Symbols Nerd Font

# Weather Icons
symbol_map U+E300-U+E3EB Symbols Nerd Font

# Codicons — VS Code icons (new in v3, covers pnpm/package/etc.)
symbol_map U+EA60-U+EC1E Symbols Nerd Font

# Supplementary plane Material Design Icons (new in v3)
symbol_map U+F0001-U+F1AF0 Symbols Nerd Font

# Misc code point fixes
symbol_map U+21B5,U+25B8,U+2605,U+2630,U+2632,U+2714 Symbols Nerd Font
